name: FlClash Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main build to the public update channel
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'upstream/**']

permissions:
  contents: read

concurrency:
  group: flclash-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository != 'chen08209/FlClash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify update delivery validation
        run: python3 -m unittest discover -s tool/update-channel -p 'test_*.py'
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip unused Go build hook in UI tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text()
          path.write_text(source.replace('setup:\n      build_assets: true', 'setup:\n      build_assets: false', 1))
          PY
      - name: Verify interface and source rules
        run: flutter test test/views/navigation_test.dart test/views/requests_test.dart test/pages/home_test.dart test/views/theme_test.dart test/models/config_test.dart test/widgets/white_surfaces_test.dart test/widgets/sidebar_test.dart test/widgets/liquid_glass_test.dart test/widgets/liquid_glass_host_test.dart test/views/dashboard/layout_test.dart test/views/dashboard/recent_requests_test.dart test/common/migration_test.dart test/common/request_test.dart test/l10n test/lint --concurrency 2
      - name: Verify custom release versions
        run: flutter test test/common/request_test.dart --dart-define=UPDATE_REPOSITORY=example/FlClash

  windows:
    needs: checks
    if: github.repository != 'chen08209/FlClash'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build
        env:
          UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY }}
        run: |
          $updateArguments = @()
          if ($env:UPDATE_REPOSITORY) {
            if ($env:UPDATE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid update repository' }
            $updateArguments += "--dart-define=UPDATE_REPOSITORY=$env:UPDATE_REPOSITORY"
          }
          flutter build windows --release --build-number=${{ github.run_number }} @updateArguments
      - name: Include license
        run: Copy-Item LICENSE build/windows/x64/runner/Release/LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && (vars.RELEASE_ENABLED == 'true' || inputs.publish == true) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: bundle
      - name: Prepare verified build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="FlClash-$version-windows-amd64.zip"
          (cd bundle && zip -qr "../$name" .)
          python3 tool/update_channel.py prepare "$name" "$version" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
      - name: Deliver to public update repository
        shell: bash
        env:
          UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY }}
          UPDATE_DEPLOY_KEY: ${{ secrets.UPDATE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$UPDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test -n "$UPDATE_DEPLOY_KEY"
          key="$RUNNER_TEMP/update-deploy-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$UPDATE_DEPLOY_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/update-known-hosts"
          export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$RUNNER_TEMP/update-known-hosts'"
          git clone --depth 1 "git@github.com:$UPDATE_REPOSITORY.git" "$RUNNER_TEMP/update-channel"
          cp delivery.json SHA256SUMS.txt FlClash-*-windows-amd64.zip "$RUNNER_TEMP/update-channel/"
          cd "$RUNNER_TEMP/update-channel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="deliveries/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git add delivery.json SHA256SUMS.txt FlClash-*-windows-amd64.zip
          git commit -m 'build: deliver verified FlClash update'
          git push origin "HEAD:refs/heads/$branch"

  promote-upstream:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/upstream/') && github.event_name == 'workflow_dispatch' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance main after successful checks and build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/main
          gh workflow run flclash-windows.yml --ref main --repo "$TARGET_REPO"
