name: FlClash Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main build to the public update channel
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'upstream/**']

permissions:
  contents: read

concurrency:
  group: flclash-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository != 'chen08209/FlClash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Verify Go core
        working-directory: core
        run: go test ./...
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: Verify Rust editor and IPC
        run: cargo test --manifest-path plugins/rust_api/rust/Cargo.toml
      - name: Resolve dependencies
        id: dependencies
        run: flutter pub get
      - name: Verify release package validation
        run: python3 -m unittest discover -s tool/update-channel -p 'test_*.py'
      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip unused Go build hook in UI tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text()
          path.write_text(source.replace('setup:\n      build_assets: true', 'setup:\n      build_assets: false', 1))
          PY
      - name: Run all tests with coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: dart run tool/test.dart -- --reporter expanded --coverage --concurrency 2
      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75
      - name: Verify custom release versions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test test/common/request_test.dart test/common/app_update_test.dart test/widgets --dart-define=UPDATE_REPOSITORY=${{ github.repository }} --concurrency 2

  windows:
    needs: checks
    if: github.repository != 'chen08209/FlClash'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Fetch verified CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Build and package
        env:
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          $version = (Select-String '^version: ([^+]+)' pubspec.yaml).Matches.Groups[1].Value
          (Get-Content pubspec.yaml -Raw) -replace '(?m)^version: .*$', "version: $version+$env:GITHUB_RUN_NUMBER" | Set-Content pubspec.yaml -NoNewline
          dart tool/package.dart windows --env stable --tag "v$version" --targets exe,zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          Copy-Item "dist/FlClash-dev-$version-windows-amd64-setup.exe" "dist-installer/FlClash-$version+$env:GITHUB_RUN_NUMBER-windows-amd64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && (vars.RELEASE_ENABLED == 'true' || inputs.publish == true) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-windows-installer
          path: installer
      - name: Prepare verified build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="FlClash-$version-windows-amd64.zip"
          (cd bundle && zip -qr "../$name" .)
          setup="FlClash-$version+$GITHUB_RUN_NUMBER-windows-amd64-setup.exe"
          cp "installer/$setup" .
          python3 tool/update_channel.py prepare "$name" "$version" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$setup"
      - name: Publish in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(python3 tool/update_channel.py validate .)
          file=$(python3 -c 'import json; print(json.load(open("build-info.json"))["file"])')
          setup=$(python3 -c 'import json; print(json.load(open("build-info.json"))["installer"])')
          if gh release view "$tag" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 0; fi
          latest=$(gh api "repos/$TARGET_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          is_latest=true
          if [ -n "$latest" ] && ! python3 tool/update_channel.py newer "$tag" "$latest"; then is_latest=false; fi
          printf 'FlClash %s\n\nModified build based on [chen08209/FlClash](https://github.com/chen08209/FlClash). Licensed under GPL-3.0.\n\nSource: https://github.com/%s/tree/%s\n\nBuild from the corresponding source, including submodules:\n\n```sh\ngit clone --recursive --branch "%s" https://github.com/%s.git\n```\n\nVerify the download with SHA256SUMS.txt.\n' "$tag" "$TARGET_REPO" "$GITHUB_SHA" "$tag" "$TARGET_REPO" > release-notes.txt
          gh release create "$tag" "$file" "$setup" SHA256SUMS SHA256SUMS.txt build-info.json LICENSE --repo "$TARGET_REPO" --target "$GITHUB_SHA" --latest="$is_latest" --title "FlClash $tag" --notes-file release-notes.txt

  promote-upstream:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/upstream/') && github.event_name == 'workflow_dispatch' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance main after successful checks and build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/main
          gh workflow run flclash-windows.yml --ref main --repo "$TARGET_REPO"
