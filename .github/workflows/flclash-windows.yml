name: FlClash Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main build to the public update channel
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'upstream/**']

permissions:
  contents: read

concurrency:
  group: flclash-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository != 'chen08209/FlClash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify release package validation
        run: python3 -m unittest discover -s tool/update-channel -p 'test_*.py'
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip unused Go build hook in UI tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pubspec.yaml')
          source = path.read_text()
          path.write_text(source.replace('setup:\n      build_assets: true', 'setup:\n      build_assets: false', 1))
          PY
      - name: Verify interface and source rules
        run: flutter test test/views/navigation_test.dart test/views/requests_test.dart test/pages/home_test.dart test/views/theme_test.dart test/models/config_test.dart test/widgets/rounded_surfaces_test.dart test/icons test/manager/window_header_test.dart test/manager/theme_manager_test.dart test/common/helpers_test.dart test/widgets/proxy_card_focus_test.dart test/widgets/profile_focus_test.dart test/widgets/list_header_focus_test.dart test/widgets/list_row_separator_test.dart test/widgets/proxies_tab_test.dart test/widgets/proxies_list_test.dart test/widgets/sidebar_test.dart test/widgets/liquid_glass_test.dart test/widgets/liquid_glass_host_test.dart test/views/dashboard/layout_test.dart test/views/dashboard/quick_routes_test.dart test/common/migration_test.dart test/common/request_test.dart test/l10n test/lint --concurrency 2
      - name: Verify custom release versions
        run: flutter test test/common/request_test.dart --dart-define=UPDATE_REPOSITORY=${{ github.repository }}
      - name: Verify added utilities
        run: flutter test test/common/node_exclusion_test.dart test/providers/node_exclusion_test.dart test/common/compute_test.dart test/common/webdav_test.dart test/common/dav_client_test.dart test/views/settings_search_test.dart test/views/backup_versions_test.dart test/views/backup_and_restore_test.dart test/providers/backup_action_test.dart --concurrency 2
      - name: Verify settings destinations
        run: flutter test test/widgets/views_smoke_test.dart --name 'settings opens|settings renders its default state'

  windows:
    needs: checks
    if: github.repository != 'chen08209/FlClash'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build
        run: |
          flutter build windows --release --build-number=$env:GITHUB_RUN_NUMBER --dart-define=APP_ENV=stable "--dart-define=UPDATE_REPOSITORY=$env:GITHUB_REPOSITORY"
      - name: Include license and modification notice
        run: |
          Copy-Item LICENSE build/windows/x64/runner/Release/LICENSE.txt
          Copy-Item MODIFICATIONS.md build/windows/x64/runner/Release/MODIFICATIONS.md
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && (vars.RELEASE_ENABLED == 'true' || inputs.publish == true) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-windows-amd64
          path: bundle
      - name: Prepare verified build
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          name="FlClash-$version-windows-amd64.zip"
          (cd bundle && zip -qr "../$name" .)
          python3 tool/update_channel.py prepare "$name" "$version" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
      - name: Publish in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(python3 tool/update_channel.py validate .)
          file=$(python3 -c 'import json; print(json.load(open("build-info.json"))["file"])')
          if gh release view "$tag" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 0; fi
          latest=$(gh api "repos/$TARGET_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          is_latest=true
          if [ -n "$latest" ] && ! python3 tool/update_channel.py newer "$tag" "$latest"; then is_latest=false; fi
          printf 'FlClash %s\n\nModified build based on [chen08209/FlClash](https://github.com/chen08209/FlClash). Licensed under GPL-3.0.\n\nSource: https://github.com/%s/tree/%s\n\nBuild from the corresponding source, including submodules:\n\n```sh\ngit clone --recursive --branch "%s" https://github.com/%s.git\n```\n\nVerify the download with SHA256SUMS.txt.\n' "$tag" "$TARGET_REPO" "$GITHUB_SHA" "$tag" "$TARGET_REPO" > release-notes.txt
          gh release create "$tag" "$file" SHA256SUMS.txt build-info.json LICENSE --repo "$TARGET_REPO" --target "$GITHUB_SHA" --latest="$is_latest" --title "FlClash $tag" --notes-file release-notes.txt

  promote-upstream:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/upstream/') && github.event_name == 'workflow_dispatch' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance main after successful checks and build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/main
          gh workflow run flclash-windows.yml --ref main --repo "$TARGET_REPO"
