name: Check FlClash upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'chen08209/FlClash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open an update for the latest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/chen08209/FlClash/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 0
          git remote add upstream https://github.com/chen08209/FlClash.git
          git fetch upstream "refs/tags/$tag:refs/tags/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then exit 0; fi
          branch="upstream/$tag"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            gh workflow run flclash-windows.yml --ref "$branch" --repo "$TARGET_REPO"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          if git merge --no-edit "$tag"; then
            git push origin "$branch"
            gh workflow run flclash-windows.yml --ref "$branch" --repo "$TARGET_REPO"
            printf 'Upstream %s merged into candidate branch %s.\n\nSource: https://github.com/%s/tree/%s\nBuilds: https://github.com/%s/actions/workflows/flclash-windows.yml\n\nWhen RELEASE_ENABLED is true, successful checks and Windows build advance main and publish an update. Conflicts, failed checks, or a changed main stop promotion.\n' "$tag" "$branch" "$TARGET_REPO" "$branch" "$TARGET_REPO" > /tmp/update-body.txt
            gh issue create --repo "$TARGET_REPO" --title "FlClash update candidate: $tag" --body-file /tmp/update-body.txt
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            existing=$(gh issue list --repo "$TARGET_REPO" --search "Upstream merge conflict: $tag in:title" --state open --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              printf 'The existing build is unchanged. Resolve these files before updating:\n\n%s\n' "$conflicts" > /tmp/conflict-body.txt
              gh issue create --repo "$TARGET_REPO" --title "Upstream merge conflict: $tag" --body-file /tmp/conflict-body.txt
            fi
          fi
